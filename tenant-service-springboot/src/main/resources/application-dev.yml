spring:
  profiles:
    active: dev
  
  datasource:
    url: jdbc:postgresql://localhost:5432/killbill_tenant_dev
    username: killbill_dev
    password: killbill_dev_password
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
  
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
  
  redis:
    host: localhost
    port: 6379

server:
  port: 8080

logging:
  level:
    root: INFO
    org.killbill: DEBUG
    org.springframework: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
