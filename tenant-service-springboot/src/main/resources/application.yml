spring:
  application:
    name: tenant-service
    version: @project.version@
  
  # Profiles (dev, test, prod)
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  # Jackson configuration for JSON serialization
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: false
    deserialization:
      fail-on-unknown-properties: false
  
  # DataSource configuration (can be overridden in profile-specific files)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:killbill_tenant}
    username: ${DB_USERNAME:killbill}
    password: ${DB_PASSWORD:killbill}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      idle-timeout: 600000
      connection-timeout: 30000
      auto-commit: true
      max-lifetime: 1800000
  
  # JPA/Hibernate configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQL10Dialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQL10Dialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
          fetch_size: 50
  
  # Flyway database migration
  flyway:
    baselineOnMigrate: true
    schemas: public
    locations: classpath:db/migration
    enabled: true
  
  # Redis/Caching configuration
  cache:
    type: redis
    redis:
      time-to-live: 3600000  # 1 hour in milliseconds
  
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 2000ms
    jedis:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 2
    connect-timeout: 3000ms
  
  # Security configuration
  security:
    user:
      name: admin
      password: admin123

# Server configuration
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  compression:
    enabled: true
    min-response-size: 1024
  error:
    include-message: always
    include-stacktrace: on_param
    include-binding-errors: always

# Actuator endpoints for health checks and metrics
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,5s
  prometheus:
    metrics:
      export:
        enabled: true

# Logging configuration (can be overridden by logback-spring.xml)
logging:
  level:
    root: INFO
    org.killbill: DEBUG
    org.springframework: INFO
    org.hibernate: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} -%msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/tenant-service.log
    max-size: 10MB
    max-history: 10

# OpenAPI/Swagger configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# Resilience4j Circuit Breaker configuration
resilience4j:
  circuitbreaker:
    default:
      failure-rate-threshold: 50
      wait-duration-in-open-state: 30000  # 30 seconds
      permitted-number-of-calls-in-half-open-state: 3
      slow-call-rate-threshold: 80
      slow-call-duration-threshold: 2000  # 2 seconds
      automatic-transition-from-open-to-half-open-enabled: true
  timelimiter:
    default:
      timeout-duration: 5000  # 5 seconds
      cancel-running-future: true

# Application-specific properties
killbill:
  tenant:
    service:
      name: tenant-service
      version: @project.version@
    cache:
      ttl-minutes: 60
      max-entries: 10000
    api:
      key-header: X-Killbill-ApiKey
      secret-header: X-Killbill-ApiSecret
      correlation-id-header: X-Correlation-ID
    security:
      enable-api-key-auth: true
      enable-oauth2: false
